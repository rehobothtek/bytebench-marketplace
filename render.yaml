services:
  - type: web
    name: bytebench-marketplace
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /shop/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: bytebench-marketplace.onrender.com
      - key: SITE_EMAIL
        value: observernathan124@gmail.com
      - key: ADMIN_NOTIFY_EMAIL
        value: observernathan124@gmail.com
      - key: DATABASE_URL
        fromDatabase:
          name: bytebench-marketplace-db
          property: connectionString

databases:
  - name: bytebench-marketplace-db
    plan: free
